[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logicfalcon"
version = "0.1.5"
description = "LogicFalcon — Fast, precise engineering intelligence. Powered by AEGIS AI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "LogicFalcon Team (powered by AEGIS AI)" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "redis>=5.0.4",
    "aiobotocore>=2.13.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "llmfirewall-core>=1.0.0",
    "aireliability>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-redis>=4.6.0.20240425",
]
packaging = [
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
logicfalcon = "logicfalcon.cli:main"
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/Livesh-L-28/logicfalcon"
Documentation = "https://github.com/Livesh-L-28/logicfalcon#readme"
Repository = "https://github.com/Livesh-L-28/logicfalcon.git"
Issues = "https://github.com/Livesh-L-28/logicfalcon/issues"

[tool.hatch.build.targets.wheel]
packages = ["logicfalcon", "aegis", "packages"]
exclude = [
    "render_schema.json",
    "packages/autonomy",
    "packages/simulation",
    "packages/remediation",
    "packages/observability",
    "packages/events",
    "*.pyc",
    "__pycache__",
    ".env*",
    "*.db",
    "*.sqlite*",
]

[tool.hatch.build.targets.sdist]
include = [
    "/logicfalcon",
    "/aegis",
    "/packages",
    "/scripts",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
]
exclude = [
    "render_schema.json",
    "packages/autonomy",
    "packages/simulation",
    "packages/remediation",
    "packages/observability",
    "packages/events",
    ".env*",
    "*.pyc",
    "__pycache__",
    "/.gitignore",
    ".gitignore",
    ".dockerignore",
    ".DS_Store",
    "tests",
    "backups",
    "scratch",
    "dist*",
    "build*",
    "/.git",
    ".git*",
    "/docker*",
    "infrastructure",
    "docs",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["scratch", "dist", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "N818"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "apps/api", "packages"]
